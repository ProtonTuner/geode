name: Build Mod

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'mod.json'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        platform: [windows, macos, android-armv7, android-arm64]
        include:
          - platform: windows
            os: windows-latest
            arch: win
          - platform: macos
            os: macos-latest
            arch: mac
          - platform: android-armv7
            os: ubuntu-latest
            arch: android
            android_abi: armeabi-v7a
          - platform: android-arm64
            os: ubuntu-latest
            arch: android
            android_abi: arm64-v8a

    runs-on: ${{ matrix.os }}
    name: Build for ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v1
        with:
          cmake-version: '3.25'

      - name: Setup Android NDK (for Android builds)
        if: contains(matrix.platform, 'android')
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Create build directory
        run: mkdir -p build

      - name: Configure CMake (Windows)
        if: matrix.arch == 'win'
        run: |
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (macOS)
        if: matrix.arch == 'mac'
        run: |
          cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Android ARMv7)
        if: matrix.platform == 'android-armv7'
        run: |
          cd build
          cmake .. -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Android ARM64)
        if: matrix.platform == 'android-arm64'
        run: |
          cd build
          cmake .. -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-${{ matrix.platform }}
          path: build/bin/

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/bin/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Create .geode package
        run: |
          mkdir -p package
          # Copiar binarios compilados
          cp artifacts/build-windows/* package/ 2>/dev/null || true
          cp artifacts/build-macos/* package/ 2>/dev/null || true
          cp artifacts/build-android-armv7/* package/ 2>/dev/null || true
          cp artifacts/build-android-arm64/* package/ 2>/dev/null || true
          
          # Copiar archivos de configuración
          cp mod.json package/
          cp -r src/ package/ 2>/dev/null || true
          cp -r resources/ package/ 2>/dev/null || true
          cp -r assets/ package/ 2>/dev/null || true
          
          # Crear ZIP
          cd package
          zip -r -q Physics_TPS_Bypass.geode *
          mv Physics_TPS_Bypass.geode ../

      - name: Upload final package
        uses: actions/upload-artifact@v3
        with:
          name: Physics_TPS_Bypass.geode
          path: Physics_TPS_Bypass.geode

name: Build Physics TPS Mod

on:
  push:
    branches: [ main, master, develop ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive
      
      - name: Setup Geode environment
        run: |
          # Descargar y configurar Geode SDK
          echo "Setting up Geode SDK..."
          # Esto depende de cómo esté configurado tu proyecto
          # Típicamente Geode CLI hace esto automáticamente
      
      - name: Install Geode CLI
        run: |
          # Instalar Geode CLI (si usas Windows/Linux)
          # Para macOS diferente
          curl -L https://github.com/geode-sdk/geode/releases/download/v2.0.0/geode-cli-linux -o geode
          chmod +x geode
          ./geode --version
      
      - name: Build Physics TPS Mod
        run: |
          # Compilar para todas las plataformas
          ./geode build
      
      - name: Verify binaries
        run: |
          echo "Checking generated binaries..."
          ls -lh build/
          
          # Verificar que ambos Android .so existen
          if [ -f "build/paradox.physicstps.android64.so" ]; then
            echo "✓ Android 64-bit found"
          else
            echo "✗ Android 64-bit NOT found"
          fi
          
          if [ -f "build/paradox.physicstps.android32.so" ]; then
            echo "✓ Android 32-bit found"
          else
            echo "✗ Android 32-bit NOT found"
          fi
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: Physics-TPS-Build
          path: |
            build/*.geode
            build/*.so
      
      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/*.geode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

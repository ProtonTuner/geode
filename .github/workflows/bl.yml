name: Build Physics TPS Mod

on:
  push:
    branches: [ main, master, develop ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git
      
      - name: Download Geode SDK
        run: |
          mkdir -p ~/geode-sdk
          cd ~/geode-sdk
          git clone https://github.com/geode-sdk/geode.git .
          echo "GEODE_SDK=$HOME/geode-sdk" >> $GITHUB_ENV
      
      - name: Verify Geode SDK
        run: |
          echo "GEODE_SDK is: $GEODE_SDK"
          ls -la $GEODE_SDK/CMakeLists.txt
      
      - name: Build Physics TPS Mod
        run: |
          mkdir -p build
          cd build
          cmake -DGEODE_SDK=$GEODE_SDK ..
          cmake --build . --config Release
          cd ..
          echo "=== Build complete, checking for binaries ==="
          find build -type f \( -name "*.so" -o -name "*.geode" \) 2>/dev/null | sort
      
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Physics-TPS-Build
          path: |
            build/
          retention-days: 30
      
      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/**/*.geode
            build/**/*.so
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
